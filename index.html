<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: transparent; overflow: hidden; }
#fq-fab{position:fixed;bottom:16px;right:16px;z-index:9999;width:60px;height:60px;border-radius:50%;background:#8ecda0;border:none;cursor:pointer;box-shadow:0 4px 20px rgba(142,205,160,.5);display:flex;align-items:center;justify-content:center;transition:transform .2s,box-shadow .2s;}
#fq-fab:hover{transform:scale(1.08);}
#fq-fab svg{width:28px;height:28px;}
#fq-badge{position:absolute;top:-4px;right:-4px;background:#e74c3c;color:#fff;font-family:sans-serif;font-size:11px;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff;}
#fq-window{position:fixed;bottom:88px;right:16px;z-index:9998;width:340px;max-height:520px;background:#fff;border-radius:20px;box-shadow:0 12px 48px rgba(0,0,0,.18);display:flex;flex-direction:column;transform:scale(0) translateY(20px);transform-origin:bottom right;transition:transform .28s cubic-bezier(.34,1.56,.64,1),opacity .2s;opacity:0;pointer-events:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;}
#fq-window.open{transform:scale(1) translateY(0);opacity:1;pointer-events:all;}
#fq-head{background:#4a7c59;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
#fq-head-avatar{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
#fq-head-avatar img{width:40px;height:40px;object-fit:cover;border-radius:50%;}
#fq-head-info{flex:1;}
#fq-head-name{color:#fff;font-weight:700;font-size:14px;}
#fq-head-sub{color:rgba(255,255,255,.82);font-size:11px;margin-top:2px;}
#fq-close{background:rgba(255,255,255,.2);border:none;cursor:pointer;width:28px;height:28px;border-radius:50%;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;}
#fq-msgs{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:8px;background:#fafaf8;}
#fq-chips{display:flex;flex-wrap:wrap;gap:6px;padding:6px 12px 2px;flex-shrink:0;background:#fafaf8;}
.fq-chip{background:#f0f7f2;color:#2d6b45;border:1px solid #b8dcc5;border-radius:20px;padding:5px 10px;font-size:11px;font-family:inherit;cursor:pointer;font-weight:500;}
.fq-chip:hover{background:#d4edd9;}
.fq-bubble{max-width:85%;padding:9px 13px;border-radius:14px;font-size:13px;line-height:1.6;word-break:break-word;}
.fq-bubble.bot{background:#fff;color:#222;border-top-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.08);align-self:flex-start;}
.fq-bubble.user{background:#4a7c59;color:#fff;border-top-right-radius:4px;align-self:flex-end;}
.fq-bubble a{color:#2d6b45;}
.fq-typing{display:flex;gap:5px;padding:10px 13px;align-self:flex-start;background:#fff;border-radius:14px;border-top-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.fq-dot{width:7px;height:7px;border-radius:50%;background:#ccc;animation:fqDot 1.3s infinite;}
.fq-dot:nth-child(2){animation-delay:.18s;}
.fq-dot:nth-child(3){animation-delay:.36s;}
@keyframes fqDot{0%,80%,100%{transform:scale(.8);opacity:.5}40%{transform:scale(1.1);opacity:1}}
#fq-input-row{display:flex;gap:8px;padding:8px 10px 10px;background:#fff;border-top:1px solid #f0ede8;flex-shrink:0;}
#fq-input{flex:1;border:1.5px solid #e8e3dc;border-radius:22px;padding:8px 12px;font-size:13px;font-family:inherit;outline:none;background:#fafaf8;color:#222;}
#fq-input:focus{border-color:#4a7c59;background:#fff;}
#fq-send{width:38px;height:38px;border-radius:50%;background:#4a7c59;border:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
#fq-send svg{width:16px;height:16px;fill:#fff;}
#fq-powered{text-align:center;font-size:10px;color:#bbb;padding:0 0 6px;background:#fff;flex-shrink:0;}
</style>
</head>

      <div id="fq-head-name">Wilson @ Fruicey</div>

  <div id="fq-msgs"></div>
  <div id="fq-chips">
    <button class="fq-chip" onclick="fqChip('What do you recommend?')">💡 Recommend me</button>
    <button class="fq-chip" onclick="fqChip('Show me your smoothies')">🥤 Smoothies</button>
    <button class="fq-chip" onclick="fqChip('Tell me about acai bowls')">🥣 Acai bowls</button>
    <button class="fq-chip" onclick="fqChip('What are your opening hours?')">🕐 Hours</button>
  </div>
  <div id="fq-input-row">
    <input id="fq-input" type="text" placeholder="Ask Wilson anything..." autocomplete="off"/>
    <button id="fq-send"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button>
  </div>
  <div id="fq-powered">Powered by AI · Fruicey 福星果</div>
</div>

<script>
var WORKER_URL = 'https://fruicey-bot.fruiceysg.workers.dev/';
var WA_NUMBER = '6585098095';
var history = [], isOpen = false, isTyping = false, hasOpened = false;
var fab = document.getElementById('fq-fab');
var win = document.getElementById('fq-window');
var msgs = document.getElementById('fq-msgs');
var inp = document.getElementById('fq-input');
var badge = document.getElementById('fq-badge');

fab.onclick = function() {
  isOpen = !isOpen;
  win.classList.toggle('open', isOpen);
  badge.style.display = 'none';
  if (isOpen && !hasOpened) { hasOpened = true; setTimeout(opening, 300); }
  if (isOpen) setTimeout(function(){ inp.focus(); }, 350);
};
document.getElementById('fq-close').onclick = function(){ isOpen = false; win.classList.remove('open'); };
document.getElementById('fq-send').onclick = send;
inp.onkeydown = function(e){ if(e.key==='Enter') send(); };
setTimeout(function(){ if(!isOpen) badge.style.display='flex'; }, 8000);

window.fqChip = function(t) {
  document.getElementById('fq-chips').style.display='none';
  bubble('user', esc(t));
  history.push({role:'user',content:t});
  ask();
};

function opening() {
  bubble('bot', "Hey there, Wilson here at Fruicey, well \u2014 the digital me anyway \ud83d\ude04<br><br>What are you in the mood for today?");
  history.push({role:'assistant', content:"Hey there, Wilson here at Fruicey, well — the digital me anyway 😄 What are you in the mood for today?"});
}

function send() {
  var t = inp.value.trim();
  if (!t || isTyping) return;
  inp.value = '';
  document.getElementById('fq-chips').style.display='none';
  bubble('user', esc(t));
  history.push({role:'user',content:t});
  ask();
}

function ask() {
  isTyping = true;
  var tp = typing();
  fetch(WORKER_URL, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({messages: history})
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    tp.remove(); isTyping = false;
    var reply = (d.content && d.content[0] && d.content[0].text) || "Oops! Try again or WhatsApp us.";
    history.push({role:'assistant',content:reply});
    bubble('bot', fmt(reply));
  })
  .catch(function(){
    tp.remove(); isTyping = false;
    bubble('bot','Hit a snag! Chat Wilson on WhatsApp \u2192 <a href="https://wa.me/'+WA_NUMBER+'" target="_blank">tap here</a>');
  });
}

function bubble(r, h) {
  var d = document.createElement('div');
  d.className = 'fq-bubble '+r;
  d.innerHTML = h;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
  return d;
}

function typing() {
  var d = document.createElement('div');
  d.className = 'fq-typing';
  d.innerHTML = '<div class="fq-dot"></div><div class="fq-dot"></div><div class="fq-dot"></div>';
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
  return d;
}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt(t){
  return t.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
          .replace(/\*(.*?)\*/g,'<em>$1</em>')
          .replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank">$1</a>')
          .replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>');
}
</script>
